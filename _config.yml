title: Yintong Zhou
description: "My GitHub projects: what they do, how they are built and where to find the code."
url: "https://yintong-zhou.github.io"   # domain only
baseurl: ""                              # "/repo" for project sites
lang: en
github_username: yintong-zhou
about_url: "https://yintong-zhou.pages.dev/"   # personal site, linked from the navbar

# Used by jekyll-seo-tag: schema.org logo. The social preview image is a page-level value,
# so its default is set in `defaults` below. Browser icons are in _includes/head.html.
logo: /assets/img/icon-512.png

# Languages: the default one is served at /, any other under /<code>/. Only English is enabled now
# (the switcher is hidden while there is a single language). Adding a language = add it here, add a
# block in _data/i18n.yml, a `projects_<code>` collection + defaults scope below, translated pages
# in <code>/ and one translation stub per project (details in CLAUDE.md).
default_lang: en
languages: [en]

markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from   # old /dashboard/ URL -> /projects/

sass:
  style: compressed

# One page per project: _projects/<name>.md (front matter = repository info, in the default language).
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  # Pages only: project documents use `image` for their own screenshot (see layouts/project_details.html)
  - scope:
      path: ""
      type: pages
    values:
      image: /assets/img/icon-512.png
  - scope:
      path: ""
      type: projects
    values:
      layout: project_details
      lang: en

# Not published. Add every new service folder here.
exclude:
  - AGENT.md
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - directives/
  - execution/
  - .tmp/
  - .env
  - credentials.json
  - token.json
  - brand-guidelines.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
