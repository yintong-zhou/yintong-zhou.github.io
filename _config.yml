title: Yintong Zhou
description: "I miei progetti su GitHub: cosa fanno, come sono fatti e dove trovare il codice."
url: "https://yintong-zhou.github.io"   # domain only
baseurl: ""                              # "/repo" for project sites
lang: it
github_username: yintong-zhou

# Used by jekyll-seo-tag: schema.org logo. The social preview image is a page-level value,
# so its default is set in `defaults` below. Browser icons are in _includes/head.html.
logo: /assets/img/icon-512.png

# Multilanguage: default language is served at /, the others under /<code>/.
# Adding a language = add it here, add a block in _data/i18n.yml, a `projects_<code>`
# collection below, and translated pages in <code>/.
default_lang: it
languages: [it, en]

markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

sass:
  style: compressed

# One page per project: _projects/<name>.md (front matter = repository info).
#  - projects: one file per project, holds the repository data (Italian = default language)
#  - projects_<code>: one small file per project and language, only translations
#    (`ref` = file name of the base project, `title`, `summary`, optional body text)
collections:
  projects:
    output: true
    permalink: /projects/:name/
  projects_en:
    output: true
    permalink: /en/projects/:name/

defaults:
  # Pages only: project documents use `image` for their own screenshot (see layouts/project.html)
  - scope:
      path: ""
      type: pages
    values:
      image: /assets/img/icon-512.png
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      lang: it
  - scope:
      path: ""
      type: projects_en
    values:
      layout: project
      lang: en

# Not published. Add every new service folder here.
exclude:
  - AGENT.md
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - directives/
  - execution/
  - .tmp/
  - .env
  - credentials.json
  - token.json
  - brand-guidelines.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
