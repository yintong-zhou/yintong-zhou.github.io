<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Runs before first paint: restore the chosen theme, flag the first visit of the session for the intro.
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem("theme");
        if (theme) root.setAttribute("data-theme", theme);
        if (!sessionStorage.getItem("intro-seen")) {
          root.classList.add("intro");
          sessionStorage.setItem("intro-seen", "1");
        }
      } catch (e) {}
    })();
  </script>
  {% seo %}
  {%- for item in alts -%}
    {%- assign parts = item | split: "|" -%}
    {%- if parts[2] == "1" %}
  <link rel="alternate" hreflang="{{ parts[0] }}" href="{{ parts[1] | absolute_url }}">
    {%- endif -%}
  {%- endfor %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Outfit:wght@600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/transitions.css' | relative_url }}">
  {% feed_meta %}
</head>
