<header class="site-header">
  <div class="wrap">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Principale">
      <a href="{{ '/dashboard/' | relative_url }}"{% if page.url == '/dashboard/' %} aria-current="page"{% endif %}>Progetti</a>
      <a href="https://github.com/{{ site.github_username }}" rel="noopener">GitHub</a>
      <button class="theme-toggle" type="button" aria-label="Cambia tema" data-theme-toggle>
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="8" cy="8" r="6"/>
          <path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
